<!doctype html>
<html lang="he" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>חיפוש משרות היי-טק בישראל — JobTrail</title>

<!-- SEO. Google reads this page's HTML with JavaScript disabled on the first
     pass, so the title and description below are the only things guaranteed to
     be indexed — the job list itself arrives by fetch() after load. That is why
     the description describes the *service*, not the current results. -->
<meta name="description"
      content="חיפוש משרות ישירות מאתרי הקריירה של חברות בישראל — אמזון, גוגל, אנבידיה, מובילאיי, אלביט ועוד. סינון לפי מיקום, ניסיון והיקף משרה, ומעקב אחרי ההגשות שלך.">
<!-- The live address. It appears in three files — here, robots.txt and
     sitemap.xml — and all three must agree. A canonical pointing anywhere else
     tells Google "the real version of this page lives at that other URL",
     which is an instruction not to index this one. Wrong is worse than absent. -->
<link rel="canonical" href="https://jobtrail-0xhs.onrender.com/">
<meta property="og:url" content="https://jobtrail-0xhs.onrender.com/">
<meta property="og:type" content="website">
<meta property="og:title" content="JobTrail — משרות היי-טק ישירות מאתרי החברות">
<meta property="og:description"
      content="משרות מאתרי הקריירה עצמם, בלי לוחות מודעות ובלי עיכוב. סינון לפי מיקום, ניסיון והיקף משרה.">
<meta property="og:locale" content="he_IL">

<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<a class="skip-link" href="#results">דלג לתוצאות</a>

<header class="site-header">
  <h1>JobTrail</h1>
  <nav class="main-nav" aria-label="ניווט ראשי">
    <a href="index.html" aria-current="page">חיפוש משרות</a>
    <a href="tracker.html">מעקב הגשות</a>
  </nav>
  <span class="spacer"></span>
  <button type="button" class="icon-btn" id="theme-toggle" aria-pressed="false">
    <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg>
    <span id="theme-label">מצב לילה</span>
  </button>
  <!-- Sits after the spacer, so it lands on the physical left edge in RTL.
       The link is the no-JS default; ui.js swaps it for a logout button when
       the server says someone is signed in. -->
  <div id="account-slot"><a class="btn" href="login.html">התחברות</a></div>
</header>

<main>
  <form class="filters" id="filters" role="search" aria-labelledby="filters-legend">
    <fieldset>
      <legend id="filters-legend">סינון משרות</legend>

      <div class="search-row">
        <div class="field">
          <label for="f-q">חיפוש חופשי</label>
          <input type="text" id="f-q" name="q" class="ltr" autocomplete="off"
                 placeholder="backend, algorithm…" aria-describedby="f-q-hint">
          <span id="f-q-hint" class="visually-hidden">
            מחפש בשם המשרה ובמחלקה. הקישי Enter או לחצי על כפתור החיפוש.
          </span>
        </div>
        <button type="submit" class="btn primary" id="search-btn">חיפוש</button>
      </div>

      <div class="grid">
        <div class="field combobox" id="f-company-combobox">
          <label for="f-company">חברה</label>
          <input type="text" id="f-company" role="combobox" aria-expanded="false" aria-haspopup="listbox"
                 aria-controls="f-company-listbox" aria-autocomplete="list" autocomplete="off"
                 placeholder="כל החברות" aria-describedby="f-company-hint">
          <ul id="f-company-listbox" class="combobox-listbox" role="listbox" aria-label="חברות" hidden></ul>
          <span id="f-company-hint" class="visually-hidden">
            לחצי כדי לראות את כל החברות, או הקלידי כדי לסנן ביניהן. חצים למעלה ולמטה לניווט,
            Enter לבחירה, Escape לסגירה.
          </span>
        </div>
        <div class="field">
          <label for="f-experience">רמת ניסיון</label>
          <select id="f-experience"><option value="">כל הרמות</option></select>
        </div>
        <div class="field">
          <label for="f-employment">היקף משרה</label>
          <select id="f-employment"><option value="">כל ההיקפים</option></select>
        </div>
        <div class="field multiselect" id="f-location-field">
          <span class="field-label" id="f-location-label">מיקום</span>
          <details id="f-location-menu">
            <summary id="f-location-summary">כל המיקומים</summary>
            <div class="multiselect-panel" id="f-location-options" role="group" aria-labelledby="f-location-label"></div>
          </details>
        </div>
        <div class="field">
          <label for="f-status">סטטוס הגשה</label>
          <select id="f-status">
            <option value="">כל הסטטוסים</option>
            <option value="none">לא טופל</option>
          </select>
        </div>
      </div>

      <div class="actions">
        <button type="button" class="btn" id="reset">נקה סינון</button>
      </div>
    </fieldset>
  </form>

  <div class="results-head">
    <p class="results-count" id="results-count" role="status" aria-live="polite" aria-atomic="true">טוען משרות…</p>
    <p class="results-note" id="results-note"></p>
  </div>

  <div id="results" tabindex="-1"></div>
  <nav id="pagination" class="pagination"></nav>
</main>

<script src="js/ui.js"></script>
<script src="js/search.js"></script>
</body>
</html>
