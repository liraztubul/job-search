# Render blueprint — the live JobTrail site.
#
# Render reads this from the repository and builds the Dockerfile on every push
# to the default branch. No CLI, no local Docker, no credit card.
#
# WHERE THE DATA LIVES
#
# Render's free tier gives a container with no disk that survives a restart, so
# nothing may be stored in the container itself. The database is a hosted
# libSQL database (Turso), reached over the network by the same synchronous
# code that opens a local file during development — see server/data/connection.js.
#
# That is what makes accounts real here: a registration on this site is written
# to a database that outlives the container, rather than to a filesystem that is
# discarded the next time the service sleeps.

services:
  - type: web
    name: jobtrail
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt        # closest free region to Israel
    healthCheckPath: /api/meta

    envVars:
      - key: HOST
        value: 0.0.0.0

      # Render terminates TLS at its edge, so Node sees plain HTTP. Without
      # this the session cookie would not be marked Secure and would travel the
      # public internet readable by anyone on the path.
      - key: JT_BEHIND_HTTPS
        value: "1"

      # Requests arrive through Render's proxy, so the visitor's address is in
      # X-Forwarded-For. Without this every visitor shares one apparent IP and
      # five failed logins by one person would lock out everybody.
      - key: JT_TRUST_PROXY
        value: "1"

      # --- the secrets, entered in the Render dashboard ---
      #
      # sync: false means "ask me for this value, do not read it from the
      # repository". They are secrets: this file is public, and the auth token
      # grants full read/write on the database while the session secret can be
      # used to forge a login cookie for any account.

      # Turning this on is what enables registration and login. Generate with:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - key: JT_SESSION_SECRET
        sync: false

      - key: TURSO_DATABASE_URL
        sync: false

      - key: TURSO_AUTH_TOKEN
        sync: false

      # Password reset / registration confirmation mail — see
      # server/services/emailService.js for the two-minute setup (one
      # verified sender mailbox, no domain). Leave both unset and the
      # reset/confirm links print to the log instead of sending — the app
      # still works, only the mail delivery is missing.
      - key: BREVO_API_KEY
        sync: false

      - key: JT_MAIL_FROM
        sync: false
